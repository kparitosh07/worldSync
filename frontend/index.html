<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldSync Lite - Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
            background: #f4f7fb;
            color: #1f2937;
        }

        .panel {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000010;
        }

        .status {
            font-weight: bold;
            margin: 16px 0;
        }

        button {
            padding: 10px 16px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
        }

        #log {
            background: #f3f4f6;
            padding: 12px;
            min-height: 70px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="panel">
        <h1>WorldSync Lite</h1>
        <p>Socket.IO Connection Test</p>

        <p id="status" class="status">Connecting...</p>
        <p>Socket ID: <span id="socketId">Not connected</span></p>

        <p>Player ID: <span id="playerId">Waiting...</span></p>
        <p>Position: <span id="position">Waiting...</span></p>

        <button id="connectBtn">Connect</button>
        <button id="disconnectBtn">Disconnect</button>


        <hr />

        <h2>Room Management</h2>

        <button id="createRoomBtn">Create Room</button>

        <div>
            <input id="roomIdInput" type="text" placeholder="Enter room ID" />
            <button id="joinRoomBtn">Join Room</button>
        </div>

        <p>Current Room: <span id="roomIdDisplay">None</span></p>
        <p>Players in Room: <span id="roomPlayers">0</span></p>


        <hr />
        <h2>Game Arena</h2>
        <p>Move with WASD or the arrow keys after joining a room.</p>

        <canvas id="gameCanvas" width="800" height="600"
            style="border: 2px solid #555; background: #f4f4f4; max-width: 100%;">
        </canvas>

        <h3>Connection Log</h3>
        <div id="log">Waiting for connection...</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const status = document.getElementById("status");
        const socketId = document.getElementById("socketId");
        const log = document.getElementById("log");
        const playerIdElement = document.getElementById("playerId");
        const positionElement = document.getElementById("position");

        const savedSessionToken = sessionStorage.getItem("worldsync-session-token");


        const socket = io({
            auth: (callback) => {
                callback({
                    sessionToken: sessionStorage.getItem("worldsync-session-token"),
                });
            },
        });

        const createRoomBtn = document.getElementById("createRoomBtn");
        const joinRoomBtn = document.getElementById("joinRoomBtn");
        const roomIdInput = document.getElementById("roomIdInput");
        const roomIdDisplay = document.getElementById("roomIdDisplay");
        const roomPlayers = document.getElementById("roomPlayers");

        createRoomBtn.addEventListener("click", () => {
            socket.emit("room:create");
        });

        joinRoomBtn.addEventListener("click", () => {
            const roomId = roomIdInput.value.trim();

            if (!roomId) {
                writeLog("Please enter a room ID.");
                return;
            }

            socket.emit("room:join", { roomId });
        });


        const gameCanvas = document.getElementById("gameCanvas");
        const ctx = gameCanvas.getContext("2d");

        let gamePlayers = [];


        socket.on("game:state", (data) => {
            if (!data || !Array.isArray(data.players)) return;

            // Ignore snapshots for a different room.
            const displayedRoom = roomIdDisplay.textContent;
            if (displayedRoom !== "None" && data.roomId !== displayedRoom) {
                return;
            }

            gamePlayers = data.players;
            roomPlayers.textContent = `${data.players.length}/${data.players.length > 0 ? 3 : 3}`;

            const myPlayer = data.players.find(
                (player) => player.playerId ===
                    document.getElementById("playerId").textContent
            );

            if (myPlayer) {
                document.getElementById("position").textContent =
                    `X: ${Math.round(myPlayer.x)}, Y: ${Math.round(myPlayer.y)}`;
            }

            drawArena();
        });


        function drawArena() {
            // Clear the previous frame.
            ctx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

            // Draw arena border.
            ctx.strokeStyle = "#888";
            ctx.strokeRect(0, 0, gameCanvas.width, gameCanvas.height);

            // Draw every player received from the server.
            for (const player of gamePlayers) {
                ctx.beginPath();
                ctx.arc(player.x, player.y, 15, 0, Math.PI * 2);
                ctx.fillStyle = "#2563eb";
                ctx.fill();

                ctx.fillStyle = "#111827";
                ctx.font = "12px Arial";
                ctx.fillText(
                    player.playerId.slice(0, 6),
                    player.x - 18,
                    player.y - 22
                );
            }
        }


        const pressedKeys = new Set();

        const movementKeys = new Set([
            "w", "a", "s", "d",
            "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"
        ]);

        function sendMovement() {
            let dx = 0;
            let dy = 0;

            if (pressedKeys.has("a") || pressedKeys.has("ArrowLeft")) dx -= 1;
            if (pressedKeys.has("d") || pressedKeys.has("ArrowRight")) dx += 1;
            if (pressedKeys.has("w") || pressedKeys.has("ArrowUp")) dy -= 1;
            if (pressedKeys.has("s") || pressedKeys.has("ArrowDown")) dy += 1;

            socket.emit("player:move", { dx, dy });
        }

        window.addEventListener("keydown", (event) => {
            if (!movementKeys.has(event.key)) return;

            event.preventDefault();

            if (event.repeat) return;

            pressedKeys.add(event.key);
            sendMovement();
        });

        window.addEventListener("keyup", (event) => {
            if (!movementKeys.has(event.key)) return;

            pressedKeys.delete(event.key);
            sendMovement();
        });

        window.addEventListener("blur", () => {
            pressedKeys.clear();
            socket.emit("player:stop");
        });


        socket.on("room:joined", (data) => {
            roomIdDisplay.textContent = data.roomId;
            roomPlayers.textContent = `${data.players.length}/${data.maxPlayers}`;

            writeLog(`Joined room ${data.roomId}`);
        });

        socket.on("room:player-joined", (data) => {
            if (Array.isArray(data.players)) {
                roomPlayers.textContent =
                    `${data.players.length}/${data.maxPlayers}`;
            }

            writeLog(`Player joined: ${data.playerId}`);
        });

        socket.on("room:player-left", (data) => {
            writeLog(`Player left: ${data.playerId}`);
        });

        socket.on("room:error", (data) => {
            writeLog(`Room error: ${data.message}`);
        });


        function writeLog(message) {
            log.textContent = message;
        }

        socket.on("connect", () => {
            status.textContent = "Connected";
            status.style.color = "green";
            socketId.textContent = socket.id;

            writeLog("Successfully connected to WorldSync backend.");
        });

        socket.on("player:welcome", (data) => {
            document.getElementById("playerId").textContent = data.playerId;

            document.getElementById("position").textContent =
                `X: ${data.x}, Y: ${data.y}`;

            sessionStorage.setItem(
                "worldsync-session-token",
                data.sessionToken
            );

            writeLog(
                data.recovered
                    ? `Session recovered: ${data.playerId}`
                    : `Welcome, player ${data.playerId}`
            );
        });

        socket.on("disconnect", (reason) => {
            status.textContent = "Disconnected";
            status.style.color = "red";
            socketId.textContent = "Not connected";

            writeLog("Disconnected: " + reason);
        });

        socket.on("connect_error", (error) => {
            status.textContent = "Connection failed";
            status.style.color = "red";

            writeLog("Error: " + error.message);
        });

        document.getElementById("connectBtn").onclick = () => {
            if (!socket.connected) {
                writeLog("Attempting to connect...");
                socket.connect();
            }
        };

        document.getElementById("disconnectBtn").onclick = () => {
            if (socket.connected) {
                socket.disconnect();
            }
        };

        socket.connect();
    </script>
</body>

</html>
